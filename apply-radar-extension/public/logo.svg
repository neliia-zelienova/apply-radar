<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#0A0F24" />

  <!-- Radar circles -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#3BC47F" stroke-width="3" opacity="0.6" />
  <circle cx="100" cy="100" r="50" fill="none" stroke="#3BC47F" stroke-width="2" opacity="0.4" />
  <circle cx="100" cy="100" r="30" fill="none" stroke="#3BC47F" stroke-width="2" opacity="0.3" />

  <!-- Radar sweep line -->
  <line x1="100" y1="100" x2="160" y2="70" stroke="#3BC47F" stroke-width="4" stroke-linecap="round" opacity="0.8" />

  <!-- Letter A -->
  <text x="100" y="120" font-size="72" font-family="'Inter', sans-serif" fill="#FFFFFF" text-anchor="middle" font-weight="700">A</text>
</svg>
